<div class="modal-header">
	<h5 class="modal-title">Assign admins for role: {{roleTitle$ | async}}</h5>
	<button type="button" class="close" aria-label="Close" (click)="dismiss('Cross click')">
		<span aria-hidden="true">&times;</span>
	</button>
</div>
<div class="modal-body">
	<form [formGroup]="form" novalidate>
		<h6 class="mb-3">Administrators</h6>
		<div formArrayName="users" *ngFor="let item of users.controls; let i = index;">
			<div class="form-group" [formGroupName]="i">
				<ng-select [items]="suggestedUsers[i]"
				           class="bootstrap"
				           bindLabel="email_id"
				           bindValue="_id"
				           (keyup)="onKeyUp($event, i)"
				           (add)="onAdd($event, i)"
				           formControlName="id"
				></ng-select>
			</div>
		</div>
	</form>
</div>
<div class="modal-footer">
	<div class="float-right">
		<button type="button" class="btn btn-light mr-2" (click)="dismiss()">Cancel</button>
		<button type="button" class="btn btn-primary" (click)="close()">Assign</button>
	</div>
</div>
