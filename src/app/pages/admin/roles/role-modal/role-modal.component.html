<div class="modal-header">
	<h5 class="modal-title">Create new role</h5>
	<button type="button" class="close" aria-label="Close" (click)="dismiss('Cross click')">
		<span aria-hidden="true">&times;</span>
	</button>
</div>
<div class="modal-body">
	<form [formGroup]="form" novalidate>
		<div class="form-group">
			<label class="col-form-label">
				<span>Name</span>
			</label>
			<input class="form-control"
			       formControlName="name"
			       [ngClass]="{'form-control-danger': isInvalidField('name')}"
			>
			<div *ngIf="isInvalidField('name')">
				<div *ngIf="name.errors.required" class="error">
					Name is required.
				</div>
				<div *ngIf="name.errors.duplicatedField" class="error">
					Name already exists.
				</div>
				<div *ngIf="name.errors.minlength" class="error">
					Name should consists of 3 more alphanumeric characters.
				</div>
				<div *ngIf="name.errors.emptyString" class="error">
					Name should't be empty
				</div>
			</div>
		</div>
		<div class="form-group">
			<label class="col-form-label">
				<span>Description</span>
			</label>
			<textarea class="form-control"
			          formControlName="description"
			          rows="3"
			          [ngClass]="{'form-control-danger': isInvalidField('description')}"
			></textarea>
			<div *ngIf="isInvalidField('description')">
				<div *ngIf="description.errors.required" class="error">
					Description is required.
				</div>
			</div>
		</div>
	</form>
</div>
<div class="modal-footer">
	<div class="float-right">
		<button type="button" class="btn btn-light mr-2" (click)="dismiss()">Cancel</button>
		<button type="button" [disabled]="!isFormValid()" class="btn btn-primary" (click)="close()">Create</button>
	</div>
</div>
