<div class="mt-3 pl-3 mb-3">
	<div class="row">
		<div class="col-5">
			<div class="form-row">
				<div *ngxPermissionsOnly="[perms.create]" class="form-group mb-0 col-5">
					<button type="button" class="btn btn-outline-grayed btn-sm btn-block" (click)="onAssignAdmins()">Assign Admins</button>
				</div>
				<div *ngxPermissionsOnly="[perms.delete]" class="form-group mb-0 col-5">
					<button type="button" [disabled]="!selectedItems.length" class="btn btn-outline-grayed btn-sm btn-block" (click)="onUnassignAdmins()">UnAssign Admins</button>
				</div>
			</div>
		</div>
	</div>

</div>

<div>
	<ngx-datatable
			#table
			class="bootstrap"
			pkzResponsiveDatatable
			[rows]="users$ | async"
			[rowHeight]=35
			[selected]="selectedItems"
			columnMode="force"
			selectionType="checkbox"
			(select)="onSelect($event)"
	>
		<ngx-datatable-column
				*ngxPermissionsOnly="[perms.delete]"
				[minWidth]="40"
				[width]="45"
				[maxWidth]="50"
				[sortable]="false"
				[canAutoResize]="false"
				[draggable]="false"
				[resizeable]="false"
		>
			<ng-template ngx-datatable-header-template let-value="value" let-allRowsSelected="allRowsSelected" let-selectFn="selectFn">
				<input type="checkbox" [checked]="allRowsSelected" (change)="selectFn(!allRowsSelected)"/>
			</ng-template>
			<ng-template ngx-datatable-cell-template let-row="row" let-value="value" let-isSelected="isSelected" let-onCheckboxChangeFn="onCheckboxChangeFn">
				<input [disabled]="isCurrentUser(row)" type="checkbox" [checked]="isSelected && !isCurrentUser(row)" (change)="onCheckboxChangeFn($event)"/>
			</ng-template>
		</ngx-datatable-column>

		<ngx-datatable-column name="Name" prop="user_name"></ngx-datatable-column>
		<ngx-datatable-column name="Email id" prop="email_id"></ngx-datatable-column>
	</ngx-datatable>
</div>
