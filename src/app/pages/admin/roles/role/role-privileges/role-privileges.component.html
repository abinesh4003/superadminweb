<div class="mt-2">
	<span>
		<strong>Admin Console Privileges</strong>
		<i ngbTooltip="some text"
		   class="fa fa-question-circle"
		   aria-hidden="true"
		></i>
	</span>

	<div class="row mt-3">
		<fieldset class="col-10" [disabled]="!isEditAllowed">
			<ngx-treeview [config]="config" [items]="items"></ngx-treeview>
		</fieldset>
	</div>


	<button *ngIf="isEditAllowed" class="btn btn-success pr-5 pl-5 mt-3" (click)="onSave()">Save</button>
</div>
