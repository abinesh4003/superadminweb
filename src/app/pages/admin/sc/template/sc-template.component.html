<div class="breadcrumbs-container">
	<nav aria-label="breadcrumb">
		<ol class="breadcrumb">
			<li class="breadcrumb-item"><a href="#" (click)="navigateToStores($event)">Store Category</a></li>
			<li class="breadcrumb-item active" aria-current="page">{{origData?.display_name}}</li>
		</ol>
	</nav>
	<ng-container *ngxPermissionsOnly="[perms.add_custom_field]">
		<button *ngIf="isEditPage()" type="button" class="btn btn-success" (click)="addCustomField()">+ Add custom field</button>
	</ng-container>
</div>

<ngb-tabset>
	<ngb-tab title="Store Category Template">
		<ng-template ngbTabContent>
			<div *ngIf="isPageLoaded">
				<fieldset [disabled]="isViewPage()">

					<ngx-datatable
							class="bootstrap"
							pkzResponsiveDatatable
							[rows]="rows"
							[rowHeight]="30"
							columnMode="force"
							[sorts]="sorts">
						<ngx-datatable-column name="Name" prop="display_name"></ngx-datatable-column>

						<ngx-datatable-column name="Format" prop="format">
							<ng-template let-value="value" ngx-datatable-cell-template>
								{{getFormatName(value)}}
							</ng-template>
						</ngx-datatable-column>

						<ngx-datatable-column name="Required (Main Inventory)" prop="req_inventory">
							<ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
								<input type="checkbox" [ngModel]="value" (ngModelChange)="onChange($event, 'req_inventory', row)">
							</ng-template>
						</ngx-datatable-column>

						<ngx-datatable-column name="Required (Store Template)" prop="req_store">
							<ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
								<input type="checkbox" [ngModel]="value" (ngModelChange)="onChange($event, 'req_store', row)">
							</ng-template>
						</ngx-datatable-column>

						<ngx-datatable-column name="Customer view" prop="req_user">
							<ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
								<input type="checkbox" [ngModel]="value" (ngModelChange)="onChange($event, 'req_user', row)">
							</ng-template>
						</ngx-datatable-column>

						<ngx-datatable-column name="Required" prop="required" [maxWidth]="100">
							<ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
								<input type="checkbox" [ngModel]="value" (ngModelChange)="onChange($event, 'required', row)">
							</ng-template>
						</ngx-datatable-column>

						<ngx-datatable-column name="Search" prop="is_searchable" [maxWidth]="100">
							<ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
								<input type="checkbox" [ngModel]="value" (ngModelChange)="onChange($event, 'is_searchable', row)">
							</ng-template>
						</ngx-datatable-column>

						<ngx-datatable-column name="Actions" prop="access" [maxWidth]="80">
							<ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
								<div class="actions">
									<span *ngIf="value === 1" class="actions__item">
										<i class="fa fa-lock" aria-hidden="true"></i>
									</span>
									<ng-container *ngxPermissionsOnly="[perms.delete]">
										<a
												href="#"
												title="Delete"
												*ngIf="value === 2 && isEditPage()"
												(click)="onDeleteField($event, row)"
												class="actions__item"
										>
											<i class="fa fa-trash" aria-hidden="true"></i>
										</a>
									</ng-container>
								</div>
							</ng-template>
						</ngx-datatable-column>

					</ngx-datatable>
				</fieldset>
			</div>

			<div class="mt-3">
				<ng-container *ngxPermissionsOnly="[perms.create, perms.edit]">
					<button *ngIf="isEditPage()" type="button" class="btn btn-primary mr-4 col-1" (click)="submitData()">Save</button>
				</ng-container>
				<button type="button" class="btn btn-success col-3" (click)="onPreview()">Preview store template</button>
			</div>

			<ng-container *ngxPermissionsOnly="[perms.move_to_production]">
				<div class="row mt-5" *ngIf="isPageLoaded && isEditPage()">
					<div class="card col-10 offset-1">
						<div class="card-body d-flex align-items-center justify-content-center">
							<span class="mr-2" *ngIf="!isLiveStoreCategory()">Move Alpha to Production</span>
							<span class="mr-2" *ngIf="isLiveStoreCategory()">Move Production to Alpha</span>
							<i class="fa fa-2x"
							   [ngClass]="{
						    'fa-toggle-off': !isLiveStoreCategory(),
						    'fa-toggle-on text-success': isLiveStoreCategory()
						   }"
							   aria-hidden="true"
							   (click)="toggleStatusIcon()"
							></i>

							<button class="btn btn-primary btn-sm ml-3 pr-4 pl-4" (click)="changeCategoryStatus()">Apply</button>
						</div>
					</div>
				</div>
			</ng-container>
		</ng-template>
	</ngb-tab>
</ngb-tabset>
