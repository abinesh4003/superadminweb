<div class="modal-header">
	<h5 class="modal-title mr-3">Store category list</h5>
	<ng-container *ngIf="filterFormSettings">
		<pkz-filter-form [config]="filterFormSettings"
		                 (filterChanged)="onFilter($event)"
		                 [values]="filtersObj"
		                 [embedded]="true"
		></pkz-filter-form>
	</ng-container>
	<button type="button" class="close ml-0" aria-label="Close" (click)="dismiss('Cross click')">
		<span aria-hidden="true">&times;</span>
	</button>
</div>

<div class="modal-body">
	<div *ngIf="stores?.length" class="row">
		<div *ngFor="let store of stores" class="col-3 mb-3">
			<div class="form-check form-check-inline">
				<input class="form-check-input"
				       type="checkbox"
				       [ngModel]="store.checked"
				       (ngModelChange)="onToggleStore($event, store)"
				>
				<label class="form-check-label">{{store.display_name}}</label>
			</div>
		</div>
	</div>
</div>

<div class="modal-footer justify-content-between">
	<div>
		<label for="selectAll">Select all</label>
		<input type="checkbox" id="selectAll" [ngModel]="isSelectedAll" (ngModelChange)="onSelectAll($event)">
	</div>

	<div>
		<button type="button" class="btn btn-light mr-2" (click)="dismiss()">Cancel</button>
		<button type="button" class="btn btn-primary" (click)="close()">Add</button>
	</div>
</div>
