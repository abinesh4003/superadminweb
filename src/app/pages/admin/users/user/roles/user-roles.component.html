<div class="row mt-3">
	<fieldset class="col-6" [disabled]="isDisabledForm() | async">
		<div class="form-check mb-3" *ngFor="let role of roles">
			<input class="form-check-input"
			       type="checkbox"
			       [id]="role.id"
			       [ngModel]="role.checked"
			       (ngModelChange)="onToggleRole($event, role)"
			       [disabled]="isDisabledRole(role)"
			>
			<label class="form-check-label" [for]="role.id">{{role.name}}</label>
		</div>

		<ng-container *ngxPermissionsOnly="[perms.edit]">
			<div class="mt-5" *ngIf="!(isDisabledForm() | async)">
				<button type="button" class="btn btn-success" (click)="onSave()">Save</button>
			</div>
		</ng-container>
	</fieldset>
</div>
