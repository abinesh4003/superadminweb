<div class="support-call-log-modal">
  <div class="modal-header">
    <h5 class="modal-title silver-text font-size-1-2rem">Transfer Amount</h5>
    <button type="button" class="close" aria-label="Close" (click)="dismiss()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body pt-0">

    <div class="row">
      <div class="row col-12 m-auto m-vertical-5">
        <div class="col-6 text-right">Sub Wallet Balance:</div>
        <div class="col-6 color-purple">₹ {{subWalletAmount}}</div>
      </div>
      <div class="row col-12 m-auto m-vertical-5">
        <div class="col-6 text-right">BayFay Cash Balance:</div>
        <div class="col-6">₹ {{bayFayCashBalance}}</div>
      </div>
      <div class="row col-12 m-auto m-vertical-20">
        <div class="col-6 text-right">Amount:</div>
        <div class="col-6 color-light-blue">
          <input type="number" class="form-control" [(ngModel)]="amount" (ngModelChange)="toggleCheckbox()">
          <small class="color-red"
                 *ngIf="isIncorrectAmount">Wrong Amount</small>
        </div>
      </div>
      <div class="row col-12 m-auto">
        <div class="col-6 text-right"></div>
        <div class="col-6 color-light-blue">
          <input class="form-check-input"
                 type="checkbox"
                 name="exampleRadios"
                 id="exampleRadios"
                 [(ngModel)]="isChecked"
                 [checked]="isChecked"
                 (change)="checkValue()">
          <label class="form-check-label" for="exampleRadios">
            Full Amount
          </label>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer actions">
    <div class="float-right d-flex">
      <button type="button"
              class="btn btn-primary mr-2"
              (click)="confirm()"
              [disabled]="isIncorrectAmount || amount === 0">Confirm</button>
      <button type="button"
              class="btn btn-outline-grayed"
              (click)="dismiss()">Cancel</button>
    </div>
  </div>
</div>
