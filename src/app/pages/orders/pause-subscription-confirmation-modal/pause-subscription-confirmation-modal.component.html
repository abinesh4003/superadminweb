<div class="support-call-log-modal">
  <div class="modal-header">
    <h5 class="modal-title silver-text font-size-1-2rem">Pause Subscription Confirmation</h5>
    <button type="button" class="close" aria-label="Close" (click)="dismiss()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body pt-0">

    <div class="form-check mt-2" *ngFor="let item of data.pause_fb; index as index; first as first;">
      <input class="form-check-input"
             type="radio"
             name="exampleRadios"
             id="exampleRadios{{index}}"
             [value]="item"
             [checked]="first"
             (change)="selectedReason = item">
      <label class="form-check-label ml-2" for="exampleRadios{{index}}">
        {{item}}
      </label>
    </div>

    <b class="d-block text-center mt-3">Are you sure you want to Pause the Subscription?</b>
  </div>
  <div class="modal-footer actions">
    <div class="float-right d-flex">
      <button type="button" class="btn btn-primary mr-2" (click)="save()">Yes</button>
      <button type="button" class="btn btn-outline-grayed" (click)="dismiss()">No</button>
    </div>
  </div>
</div>
