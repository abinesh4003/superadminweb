<div class="support-call-log-modal">
  <div class="modal-header">
    <h5 class="modal-title silver-text font-size-1-2rem">Customer Preferred Delivery Time:</h5>
    <button type="button" class="close" aria-label="Close" (click)="dismiss()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">


    <div class="row">
      <div class="row col-12">
        <div class="input-group m-auto w-75">
          <div class="box1 col-2">
            <label class="mr-3"
                   for="from">From:</label>
          </div>
          <div class="box2 col-10">
            <input type="text"
                   class="form-control"
                   id="from"
                   [attr.value]="getInputValue(from)"
                   disabled>
            <span class="input-group-text"
                  [ngbPopover]="fromTimeContent"
                  placement="bottom">
              <i class="fa fa-calendar" aria-hidden="true"></i>
            </span>
          </div>
        </div>
      </div>

      <div class="row col-12 mt-3">
        <div class="input-group m-auto w-75">
          <div class="box1 col-2">
            <label class="mr-3"
                   for="to">To:</label>
          </div>
          <div class="box2 col-10">
            <input type="text"
                   class="form-control"
                   id="to"
                   [attr.value]="getInputValue(to)"
                   disabled>
            <span class="input-group-text"
                  [ngbPopover]="toTimeContent"
                  placement="bottom">
              <i class="fa fa-calendar" aria-hidden="true"></i>
            </span>
          </div>
        </div>
      </div>
    </div>


    <ng-template #fromTimeContent>
      <div>
        <div class="mt-auto">
          <ngb-timepicker [(ngModel)]="from"
                          [meridian]="true"></ngb-timepicker>
        </div>
      </div>
    </ng-template>

    <ng-template #toTimeContent>
      <div>
        <div class="mt-auto">
          <ngb-timepicker [(ngModel)]="to"
                          [meridian]="true"></ngb-timepicker>
        </div>
      </div>
    </ng-template>

    <span class="error-message" *ngIf="showError">Wrong Date</span>
  </div>
  <div class="modal-footer actions">
    <div class="float-right d-flex">
      <button type="button"
              class="btn btn-outline-grayed mr-2"
              (click)="dismiss()">Close</button>
      <button type="button"
              class="btn btn-primary"
              (click)="confirm()">Save</button>
    </div>
  </div>
</div>
