<div class="support-call-log-modal">
    <div class="modal-header">
        <h5 class="modal-title silver-text font-size-1-2rem">Support call log:</h5>
        <button type="button" class="close" aria-label="Close" (click)="dismiss()">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body pt-0">
        <form [formGroup]="form" (submit)="onSubmit()">
            <textarea rows="6" formControlName="message" class="w-100"></textarea>
            <span class="error-msg" *ngIf="form.get('message').touched && form.get('message').errors?.required">Please enter a message</span>
            <div class="actions d-flex justify-content-end">
                <button type="button" class="btn btn-outline-grayed mr-3" (click)="dismiss()">Close</button>
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
        </form>
        <div class="messages" *ngIf="(messages$ | async) as messages">
            <div class="message" *ngFor="let message of messages">
                <div class="mb-1">
                    <span class="user-name">{{message.person_name}}:</span>
                    <span>{{formatDate(message.created_at)}}</span>
                </div>
                <div>
                    {{message.message}}
                </div>
            </div>
        </div>
    </div>
</div>
