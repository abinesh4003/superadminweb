<div class="reject-assistant-modal">
    <div class="modal-header border-0">
        <h5 class="modal-title">{{getTitle()}} Profile</h5>
        <button type="button" class="close" aria-label="Close" (click)="dismiss()">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body pt-0">
        <form [formGroup]="form" (submit)="onConfirm()">
            <textarea cols="15" rows="5" formControlName="feedbackMessage"></textarea>
            <div class="d-flex justify-content-end actions mt-2">
                <button type="button" class="btn btn-outline-grayed mr-3" (click)="dismiss()">Close</button>
                <button type="submit" class="btn btn-primary">{{getTitle()}}</button>
            </div>
        </form>
    </div>
</div>
