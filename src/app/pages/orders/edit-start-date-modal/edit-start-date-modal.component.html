<div class="support-call-log-modal">
  <div class="modal-header">
    <h5 class="modal-title silver-text font-size-1-2rem">Edit Start Date</h5>
    <button type="button" class="close" aria-label="Close" (click)="dismiss()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">

    <div class="form-group mb-0">
      <div class="input-group input-group-sm">
        <input class="form-control" placeholder="dd/mm/yyyy"
               name="dpFrom" [(ngModel)]="datepickerModelFrom" ngbDatepicker #dFrom="ngbDatepicker">
        <div class="input-group-append">
          <button class="btn btn-outline-secondary" (click)="dFrom.toggle()" type="button">
            <i class="fa fa-calendar" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </div>

  </div>
  <div class="modal-footer actions">
    <div class="float-right d-flex">
      <button type="button"
              class="btn btn-outline-grayed mr-2"
              (click)="dismiss()">Close</button>
      <button type="button"
              class="btn btn-primary"
              [disabled]="!datepickerModelFrom"
              (click)="confirm()">Save Changes</button>
    </div>
  </div>
</div>
