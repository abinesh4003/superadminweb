<div class="support-call-log-modal">
  <div class="modal-header">
    <h5 class="modal-title silver-text font-size-1-2rem">Recharge Log:</h5>
    <button type="button" class="close" aria-label="Close" (click)="dismiss()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body pt-0">

    <!--    for spinner while loading -->
    <select class="form-control form-control-sm distance-select d-none" [(ngModel)]="spin">
      <option *ngFor="let p of rechargeLogList">spin</option>
    </select>

    <!--    empty value text -->
    <b *ngIf="!isLoading && !rechargeLogList?.length">Recharge log not found...</b>

    <div class="card mt-3"
         *ngFor="let item of rechargeLogList">
      <div class="card-header">
        <div class="row">
          <div class="row col-12 m-auto">
            <div class="col-6 text-right">Recharged Date:</div>
            <div class="col-6 color-light-blue">{{item.credit_history.created_at | date: 'dd/MM/yyyy - hh:mm a'}}</div>
          </div>
          <div class="row col-12 m-auto">
            <div class="col-6 text-right">Amount:</div>
            <div class="col-6 color-red">₹ {{item.credit_history.amount}}</div>
          </div>
          <div class="row col-12 m-auto">
            <div class="col-6 text-right">Note:</div>
            <div class="col-6">{{item.credit_history.note}}</div>
          </div>
        </div>
      </div>
    </div>

  </div>
  <div class="modal-footer actions d-flex justify-content-center text-center">
    <button type="button" class="btn btn-outline-grayed" (click)="dismiss()">Close</button>
  </div>
</div>
