<nav *ngIf="isPageLoaded" aria-label="breadcrumb">
	<ol class="breadcrumb">
		<li class="breadcrumb-item">
			<a href="#" routerLink="../">{{rootBreadcrumbName}}</a>
		</li>
		<li class="breadcrumb-item active" aria-current="page">Bulk upload log</li>
	</ol>
</nav>

<div class="mt-3">
	<ngx-datatable
			class="bootstrap"
			pkzResponsiveDatatable
			[rows]="rows"
			[sorts]="sorts"
			[rowHeight]="35"
			columnMode="force"
			[footerHeight]="40"
	>
		<ngx-datatable-column name="S.no"></ngx-datatable-column>

		<ngx-datatable-column name="Actions" [sortable]="false">
			<ng-template ngx-datatable-cell-template let-row="row">

				<div class="actions">
					<a href="#" title="Download" class="actions__item">
						<i class="fa fa-download" aria-hidden="true"></i>
					</a>
					<a href="#" title="Info" class="actions__item">
						<i class="fa fa-info-circle" aria-hidden="true"></i>
					</a>
				</div>

			</ng-template>
		</ngx-datatable-column>

		<ngx-datatable-column name="File name"></ngx-datatable-column>

		<ngx-datatable-column name="Product count"></ngx-datatable-column>

		<ngx-datatable-column name="Valid Rows"></ngx-datatable-column>

		<ngx-datatable-column name="Invalid Rows"></ngx-datatable-column>

	</ngx-datatable>
</div>
