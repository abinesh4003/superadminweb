<div class="modal-header">
    <h5 class="modal-title">Merchant Settings</h5>
    <button type="button" class="close" aria-label="Close" (click)="dismiss()">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body">
    <div class="d-flex justify-content-center">
      <form [formGroup]="form" novalidate>
        <div>

          <div class="form-group row">
            <label class="col-6 text-right" for="isDeliveryAgency">
              Is Delivery Agency:
            </label>
            <div class="col-6">
              <div class="form-check">
                <input type="checkbox" class="form-check-input mr-2" id="isDeliveryAgency"
                       formControlName="is_delivery_agency">
              </div>
            </div>
          </div>

          <div class="form-group row">
            <label class="col-6 col-form-label text-right">
              Agency Setup Fee:
            </label>
            <div class="col-6">
              <input formControlName="agency_setup_fee"
                     type="number"
                     class="form-control"
                     [ngClass]="{'form-control-danger': isInvalidField('agency_setup_fee')}"
              >
              <div *ngIf="isInvalidField('agency_setup_fee')">
                <div *ngIf="getFormField('agency_setup_fee').errors.required"
                     class="error">
                  Field is required.
                </div>
              </div>
            </div>
          </div>

          <div class="form-group row">
            <label class="col-6 col-form-label text-right">
              Agency Deposit:
            </label>
            <div class="col-6">
              <input formControlName="agency_deposit"
                     type="number"
                     class="form-control"
                     [ngClass]="{'form-control-danger': isInvalidField('agency_deposit')}"
              >
              <div *ngIf="isInvalidField('agency_deposit')">
                <div *ngIf="getFormField('agency_deposit').errors.required"
                     class="error">
                  Field is required.
                </div>
              </div>
            </div>
          </div>

          <div class="form-group row">
            <label class="col-6 col-form-label text-right">
              Max Shop Attachment:
            </label>
            <div class="col-6">
              <input formControlName="max_shop_attachment"
                     type="number"
                     class="form-control"
                     [ngClass]="{'form-control-danger': isInvalidField('max_shop_attachment')}"
              >
              <div *ngIf="isInvalidField('max_shop_attachment')">
                <div *ngIf="getFormField('max_shop_attachment').errors.required"
                     class="error">
                  Field is required.
                </div>
              </div>
            </div>
          </div>

        </div>
      </form>
    </div>
</div>

<div class="modal-footer merchant-settings-actions">
  <button type="button" class="btn btn-outline-grayed mr-2" (click)="dismiss()">Close</button>
  <button class="btn btn-primary" type="button" (click)="onSave()">Save</button>
</div>
