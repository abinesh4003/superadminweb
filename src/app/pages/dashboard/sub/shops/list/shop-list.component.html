<div class="mt-3" *ngIf="isPageLoaded">

	<ng-container *ngIf="(filterFormSettings$ | async) as settings">
		<pkz-filter-form [config]="settings" (filterChanged)="onFilter($event)" [values]="filterValues">

			<ng-container *ngIf="isActiveTab()">
				<div class="col-12 mt-1 mb-1">
					<div class="row">
						<label class="col-auto">Delivery location</label>
						<div class="col">
							<input class="form-control form-control-sm" type="text" placeholder="search location" spellcheck="off" #search id="search" [formControl]="searchControl" [ngModel]="location">
							<!-- (ngModelChange)="onLocationChange($event)"> -->
							<span class="btn-wr">
								<i class="fa fa-map-marker violet"></i>
							</span>
						</div>

						<label class="col-auto">Radius</label>

						<div class="col">							 
							 <select class="form-control form-control-sm col-3"placeholder="Distance" [ngModel]="distance"
							 (ngModelChange)="onDistanceChange($event)">
								<option *ngFor="let item of listRadius" [value]="item">{{item}}</option>
							  </select>
						</div>

						<!-- <div class="col">
							<input class="form-control form-control-sm"
							       type="number"
							       placeholder="Longitude"
							       [ngModel]="longitude"
							       (ngModelChange)="onLongitudeChange($event)"
							>
						</div> -->
						<!-- <div class="col">
							<input class="form-control form-control-sm"
							       type="number"
							       [ngModel]="latitude"
							       (ngModelChange)="onLatitudeChange($event)"
							       placeholder="Latitude"
							>
						</div> -->

						<div class="col-auto">
							<!-- <button [disabled]="true" class="btn btn-primary btn-sm mr-3">Find on Map</button> -->
							<button class="btn btn-primary btn-sm mr-3" (click)="findOnMap()">Find on Map</button>
						</div>

						<div class="col form-check">
							<input [ngModel]="isPrivate" (ngModelChange)="onPrivateChange($event)" type="checkbox" class="form-check-input mr-2"
							 id="private-checkbox">
							<label for="private-checkbox" class="form-check-label">Private</label>
						</div>
					</div>
				</div>
			</ng-container>

		</pkz-filter-form>
	</ng-container>

	<div class="mt-3 mb-2 d-flex justify-content-between">
		<div class="d-inline-flex align-items-center">

			<fieldset *ngIf="hasPermission(perms.manage)" class="form-inline">
				<div class="form-group">
					<select class="form-control form-control-sm mr-3" [ngModel]="selectedViewUser" (ngModelChange)="onChangeViewUser($event)">
						<option value="">All</option>
						<option *ngFor="let user of assignUsers" [value]="user._id">{{user.user_name}}</option>
					</select>
				</div>
			</fieldset>

			<fieldset *ngIf="isAllowedAssign() && hasPermission(perms.manage)" class="form-inline">
				<div class="form-group">
					<label class="col-form-label col-form-label-sm">Assign To</label>
					<select class="form-control form-control-sm ml-3 mr-3" [(ngModel)]="selectedAssignUser">
						<option value=""></option>
						<option *ngFor="let user of assignUsers" [value]="user._id">{{user.user_name}}</option>
					</select>
					<button [disabled]="isDisabledAssignButton()" (click)="onAssign()" class="btn btn-primary btn-sm">Apply</button>
				</div>
			</fieldset>

		</div>

		<div class="d-inline-flex align-items-center">
			<pkz-table-configure-columns *ngIf="hasPermission(perms.configure_columns)" class="ml-3" [columns]="origColumns"
			 (changeColumns)="onChangeColumns($event)"></pkz-table-configure-columns>

			<pkz-table-delete-btn class="ml-3" *ngIf="hasPermission(perms.delete)" [disabled]="!selectedStores?.length" (delete)="onDeleteStores()"></pkz-table-delete-btn>
		</div>
	</div>

	<ngx-datatable #table class="bootstrap" pkzResponsiveDatatable [rows]="rows" [rowHeight]=35 [footerHeight]="40"
	 [selected]="selectedStores" columnMode="force" selectionType="checkbox" [scrollbarH]="true" (select)="onSelect($event)"
	 [externalPaging]="true" [count]="page.count" [offset]="page.pageNumber" [limit]="page.limit" (page)="setPage($event)">

		<ngx-datatable-column *ngIf="!isActiveTab()" [sortable]="false" [draggable]="false" [headerCheckboxable]="true"
		 [checkboxable]="true" [minWidth]="40" [width]="45" [maxWidth]="50">
		</ngx-datatable-column>

		<ngx-datatable-column [sortable]="false" name="Actions" [minWidth]="80" [width]="85" [maxWidth]="90">
			<ng-template let-row="row" ngx-datatable-cell-template>
				<div class="actions">
					<a *ngIf="hasPermission(perms.edit)" href="#" title="Edit" (click)="onEditStore($event, row)" class="actions__item">
						<i class="fa fa-pencil-square-o" aria-hidden="true"></i>
					</a>
					<a href="#" *ngIf="hasPermission(perms.view)" title="View" (click)="onViewStore($event, row)" class="actions__item">
						<i class="fa fa-list-alt" aria-hidden="true"></i>
					</a>
				</div>
			</ng-template>
		</ngx-datatable-column>

		<ngx-datatable-column *ngIf="isActiveTab()"
		                      [sortable]="false"
		                      name="Icon"
		                      prop="shop_icon"
		                      [minWidth]="80"
		                      [width]="85"
		                      [maxWidth]="90"
		>
			<ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
				<img [src]="(value || 'placeholder') | imageSecure:imageOptions | async"
				     [attr.height]="imageOptions.height / 2"
				>
			</ng-template>
		</ngx-datatable-column>

		<ngx-datatable-column *ngIf="hasPermission(perms.edit) || hasPermission(perms.view)"
		                      [sortable]="false"
		                      name="Settings"
		                      [minWidth]="80"
		                      [width]="85"
		                      [maxWidth]="90"
		>
			<ng-template let-row="row" ngx-datatable-cell-template>
				<div class="actions">
					<a href="#" [title]="hasPermission(perms.edit) ? 'Edit' : 'View'" (click)="onSettings($event, row)" class="actions__item">
						<i class="fa fa-cog" aria-hidden="true"></i>
					</a>
				</div>
			</ng-template>
		</ngx-datatable-column>

		<ngx-datatable-column name="Store Name" prop="display_name"></ngx-datatable-column>
		<ngx-datatable-column name="Store Address" prop="address.city.name"></ngx-datatable-column>
		<ngx-datatable-column name="Store Geo Location" prop="address.coordinates">
			<ng-template let-value="value" ngx-datatable-cell-template>
				<div class="actions">
					<a href="#" title="Google Maps" (click)="onViewLocation($event, value)" class="actions__item">
						<i class="fa fa-map" aria-hidden="true"></i>
					</a>
				</div>
			</ng-template>
		</ngx-datatable-column>
		<ngx-datatable-column name="Store Pincode" prop="address.zipcode"></ngx-datatable-column>
		<ngx-datatable-column name="City" prop="address.city.name"></ngx-datatable-column>
		<ngx-datatable-column name="Country" prop="address.city.country"></ngx-datatable-column>

		<ngx-datatable-footer>
			<ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize" let-selectedCount="selectedCount"
			 let-offset="offset">

				<pkz-table-pagination [rowCount]="rowCount" [pageSize]="pageSize" [selectedCount]="selectedCount" [offset]="offset"
				 (page)="table.onFooterPage($event)">
				</pkz-table-pagination>

			</ng-template>
		</ngx-datatable-footer>

	</ngx-datatable>
</div>
