<div class="modal-header">
	<h5 class="modal-title">{{title}}</h5>
	<button type="button" class="close" aria-label="Close" (click)="dismiss('Cross click')">
		<span aria-hidden="true">&times;</span>
	</button>
</div>
<div class="modal-body">
	<input type="text" class="form-control" [(ngModel)]="field">
</div>
<div class="modal-footer">
	<div class="float-right">
		<button type="button" class="btn btn-outline-grayed mr-2" (click)="dismiss()">Close</button>
		<button [disabled]="!field.length" type="button" class="btn btn-primary" (click)="close()">Preview Send</button>
	</div>
</div>
