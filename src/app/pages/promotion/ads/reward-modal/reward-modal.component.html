<div class="modal-header">
	<h5 class="modal-title">{{title}}</h5>
	<button type="button" class="close" aria-label="Close" (click)="dismiss('Cross click')">
		<span aria-hidden="true">&times;</span>
	</button>
</div>
<div class="modal-body">
	<div class="form-group row" *ngIf="isEditAllowed()">
		<div class="col-10">
			<input [type]="inputType" class="form-control" [(ngModel)]="newItem" (keyup.enter)="onAddItem()">
		</div>
		<div class="col-2 pl-0">
			<button [disabled]="!newItem.length" (click)="onAddItem()" type="button" class="w-100 btn btn-outline-grayed">Add</button>
		</div>
	</div>

	<ul *ngIf="list?.length" class="list mt-2">
		<li *ngFor="let item of list; let i = index" class="list__item">
			<input [type]="inputType"
			       class="form-control form-control-sm"
			       [ngClass]="{'form-control-plaintext': !isItemEditing(i)}"
			       [readonly]="!isItemEditing(i)"
			       [ngModel]="item"
			       (blur)="onUpdateItem()"
			       (keyup.enter)="onUpdateItem()"
			       #input
			>

			<div class="ml-3 buttons" *ngIf="!isItemEditing(i) && isEditAllowed()">
				<span (click)="onEditItem(input, i)" class="mr-2">
					<i class="fa fa-pencil text-primary" aria-hidden="true" title="Edit"></i>
				</span>

					<span (click)="onDeleteItem(i)">
					<i class="fa fa-times text-primary text-danger" aria-hidden="true" title="Delete"></i>
				</span>
			</div>
		</li>
	</ul>

</div>
<div class="modal-footer">
	<div class="float-right">
		<button type="button" class="btn btn-outline-grayed mr-2" (click)="dismiss()">Close</button>
		<button *ngIf="isEditAllowed()" type="button" class="btn btn-primary" (click)="close()">Save</button>
	</div>
</div>
