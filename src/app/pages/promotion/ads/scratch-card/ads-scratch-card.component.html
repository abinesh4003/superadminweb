<div class="card">
	<div class="card-body p-0" *ngIf="isPageLoaded">

		<form [formGroup]="form" novalidate>

				<div class="row mt-3">
					<div class="col-4 offset-2">
						<fieldset [disabled]="isFormDisabled()">
							<div class="form-group row">
								<div class="col-7 text-right">
									<label class="set-label-font" for="enabled">Enabled:</label>
								</div>
								<div class="col-5">
									<label class="switch set-label-font">
										<input type="checkbox" id="enabled" formControlName="enabled">
										<span class="slider round"></span>
									</label>
								</div>
							</div>

							<div class="form-group row">
								<label class="col-7 text-right col-form-label">Total Budget Per Day:</label>
								<div class="col-5">
									<input type="number"
									       class="form-control"
									       formControlName="budgetPerDay"
									       [ngClass]="{
								          'form-control-danger': isInvalidField('budgetPerDay'),
								          'form-control-plaintext': isFormDisabled()
							          }">
									<div *ngIf="isInvalidField('budgetPerDay')">
										<div *ngIf="form.get('budgetPerDay').hasError('required')" class="error">
											Field is required.
										</div>
									</div>
								</div>
							</div>

							<div *ngIf="isEditAllowed()" class="row">
								<div class="offset-6 col-6 mt-5">
									<button type="button" class="btn btn-sm btn-outline-primary w-100" (click)="onSave()">Save</button>
								</div>
							</div>
						</fieldset>
					</div>

					<div class="col-3 offset-1 mt-5">
						<button type="button" class="btn btn-sm btn-outline-primary w-100" (click)="onMoneyReward()">Money Reward</button>
						<button type="button" class="btn btn-sm btn-outline-primary w-100 mt-4" (click)="onOfferReward()">Offer Code Reward</button>
					</div>
				</div>

		</form>

		<ngx-datatable
			class="bootstrap mt-3"
			pkzResponsiveDatatable
			[rows]="rows"
			[rowHeight]="35"
			columnMode="force"
		>
			<ngx-datatable-column name="Date" prop="created_at" [flexGrow]="1">
				<ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
					<span>{{value | date:'dd/MM/yyyy'}}</span>
				</ng-template>
			</ngx-datatable-column>
			<ngx-datatable-column name="Budget" prop="per_day_budget"></ngx-datatable-column>
			<ngx-datatable-column name="Spent" prop="total_spent"></ngx-datatable-column>
			<ngx-datatable-column name="User Count" prop="users_attended"></ngx-datatable-column>
		</ngx-datatable>

	</div>
</div>
