<div *ngIf="title" class="modal-header">
	<h5 class="modal-title">{{title}}</h5>
	<button type="button" class="close" aria-label="Close" (click)="dismiss()">
		<span aria-hidden="true">&times;</span>
	</button>
</div>
<div *ngIf="message" class="modal-body">
	<div [innerHtml]="message"></div>
</div>
<div class="modal-footer justify-content-end">
	<button type="button" class="btn btn-primary" (click)="dismiss()">Cancel</button>
	<button type="button" class="btn btn btn-default" (click)="close()">OK</button>
</div>
