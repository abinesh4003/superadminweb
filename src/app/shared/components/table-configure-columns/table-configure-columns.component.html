<div class="btn-group btn-group-sm ml-3">
	<div class="btn-group btn-group-sm" ngbDropdown role="group" placement="bottom-right" [autoClose]="false">
		<button class="btn btn-outline-secondary" ngbDropdownToggle>Configure columns</button>
		<div class="dropdown-menu" ngbDropdownMenu>
			<div class="dropdown-item" *ngFor="let item of configureColumns">
				<div class="form-check">
					<input class="form-check-input"
					       type="checkbox"
					       [id]="item.prop"
					       [ngModel]="item.checked"
					       (ngModelChange)="toggleColumn($event, item)"
					>
					<label class="form-check-label" [for]="item.prop">
						{{item.name}}
					</label>
				</div>
			</div>
		</div>
	</div>
	<button type="button" class="btn btn-outline-secondary" [disabled]="true" (click)="onSave()">
		<i class="fa fa-floppy-o" aria-hidden="true"></i>
	</button>
</div>
