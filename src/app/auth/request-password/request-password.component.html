<pkz-auth-block>
	<h4 class="title">Forgot Password</h4>
	<form (ngSubmit)="requestPass()" #requestPassForm="ngForm">

		<div *ngIf="showMessages.error && errors && errors.length > 0 && !submitted"
		     class="alert alert-danger" role="alert">
			<div><strong>Oh snap!</strong></div>
			<div *ngFor="let error of errors">{{ error }}</div>
		</div>
		<div *ngIf="showMessages.success && messages && messages.length > 0 && !submitted"
		     class="alert alert-success" role="alert">
			<div><strong>Hooray!</strong></div>
			<div *ngFor="let message of messages">{{ message }}</div>
		</div>

		<div class="form-group">
			<label for="input-email">Enter the Email address</label>
			<input name="email" [(ngModel)]="user.email" id="input-email"
			       class="form-control" placeholder="Email address" pattern=".+@.+..+"
			       [required]="isEmailRequired"
			       autofocus
			>
		</div>

		<div class="row">
			<div class="col-6">
				<button [disabled]="submitted || !requestPassForm.form.valid" class="btn btn-block btn-secondary"
				        [class.btn-pulse]="submitted">
					Get Password
				</button>
			</div>
			<div class="col-6">
				<button class="btn btn-block btn-light" routerLink="../login">
					Cancel
				</button>
			</div>
		</div>
	</form>
</pkz-auth-block>
